name=ReflectJSON
version=1.2.1
author=Michael michi.fu@quickline.ch
maintainer=Michael michi.fu@quickline.ch
sentence=Fast JSON writer and reader for microcontrollers with struct reflection (REFLECT/MEMBER), Kotlin-style config and pretty printing.
paragraph=Write and read C++ structs as JSON without hand-written serialization code. Streaming buffer writer with validation, single-pass reader, std::optional, duplicate key detection, error paths like root.devices[2].limits.max. Needs C++17 (RP2040/RP2350, ESP32, Teensy 4.x). Free for noncommercial use; commercial use requires a license.
category=Data Processing
url=https://github.com/Michael-0-sys/ReflectJSON
architectures=*
includes=ReflectJSON.h
